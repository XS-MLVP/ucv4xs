[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ucv4xs"
version = "0.1.0"
description = "UnityChip-based unit testing for XiangShan"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MPL-2.0"}

[project.urls]
Repository = "https://github.com/XS-MLVP/ucv4xs"

[project.scripts]
ucv = "ucv.cli:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = ".", "ucv" = "src/ucv"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ucv", "ucv.*", "suites", "suites.*"]
exclude = [
    "suites.*.*.dut*", "suites.*.*.rtl*", "suites.*.*.results*",
    "suites.*.*.XiangShan*", "suites.*.*.tests*", "suites.*.*.tools*",
    "suites.*.*.docs*", "suites.*.*.manifest*", "suites.*.*.dependencies*",
    "suites.*.*.__pycache__*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
