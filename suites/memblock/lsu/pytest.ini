[pytest]
pythonpath = ../../.. .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
markers =
    selftest: environment, checker or diagnostic self-check; never hardware functional credit
    feature(id): verification functional point covered by this test
    rtl_defect: known RTL defect tracked as a strict expected failure
