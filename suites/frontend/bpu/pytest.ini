[pytest]
pythonpath = ../../.. .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
markers =
    estimated_runtime(seconds): deterministic scheduling hint, never a timeout or selection rule
    rtl_defect: known RTL defect tracked as a strict expected failure
    feature(id): verification-plan functional point covered by this test
    selftest: environment or checker self-check; never hardware functional credit
toffee_feature_plan = verification_plan.json
toffee_feature_report = results/feature-points.json
