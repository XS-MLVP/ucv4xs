[pytest]
pythonpath = ../../.. .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
markers =
    estimated_runtime(seconds): deterministic scheduling hint, never a timeout or selection rule
    feature(id): verification-plan functional point covered by this test
    rtl_defect: known RTL defect tracked as a strict expected failure
    selftest: checker/oracle self-check, not hardware functional credit
