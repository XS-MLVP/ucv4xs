[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = testbenches
python_files = test_*.py
pythonpath = ../../.. .
markers =
    selftest: environment, checker or diagnostic self-check; never hardware functional credit
    feature(id): verification-plan functional point covered by this test
    module(name): design unit under verification
toffee_feature_report = results/feature-points.json
