[pytest]
pythonpath = ../../.. .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = testbenches
markers =
    selftest: environment checks, not hardware credit
    feature(id): functional label in the owning design/verification contract
    rtl_defect: known RTL defect with its original strict expected failure
    estimated_runtime(seconds): deterministic scheduling hint, never a selection rule
