[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
addopts = --import-mode=importlib
markers =
    toffee_functional_coverage(enabled): exclude pure qualification tests from DUT coverage
    vagq_isa_audit: independent RVV/architectural audit, separate from public-contract acceptance
    vagq_exhaustive: shape-aware exhaustive public-DUT campaign; intentionally long-running
